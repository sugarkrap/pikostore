name: Build pikostore.ipk

# Builds a piko-installable .ipk of pikostore itself, so the Software
# Center can be installed onto a ROM that did not ship it pre-baked (see
# README.md -- nothing is baked into this binary; a fresh install just
# means an empty repo list until the user adds one, or the compiled-in
# default takes over).
#
# pikostore links against libfltk.so.1.3 and needs the same cross-toolchain
# and staged X11/FLTK tree tools/build-pikostore.sh in the piko repo
# already knows how to produce -- so this job checks out sugarkrap/piko as
# a nested tree, drops THIS commit into the exact spot its submodule would
# occupy (userspace/src/pikostore), and reuses piko's own build tooling
# unmodified: its cached toolchain composite action, tools/build-x11-
# stack.sh (which builds FLTK itself at its end -- see that script's own
# header), tools/build-pikostore.sh, and tools/make-ipk.sh.
#
# The resulting .ipk does NOT bundle libfltk: every piko ROM build already
# ships the X11/Matchbox stack (libfltk included) regardless of whether
# pikostore itself is installed, since Matchbox needs it too. Only
# pikostore's own binary is missing on a ROM that skipped it.
#
# This is the same multi-hour-on-cold-cache pipeline build-piko-zip.yml
# runs in the piko repo (crosstool-NG toolchain from scratch, then the
# whole X.Org + Matchbox stack) -- too heavy to run on every push, so it is
# workflow_dispatch and version-tag-triggered only.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to attach the .ipk to a GitHub Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # $GITHUB_WORKSPACE becomes piko's own repo root, deliberately --
      # every "./tools/..." and "./.github/actions/..." reference below is
      # exactly what piko's own workflows use unmodified, because piko IS
      # the workspace here, not a subdirectory of it.
      - name: Check out piko (build tooling, X11/Matchbox stack, FLTK)
        uses: actions/checkout@v4
        with:
          repository: sugarkrap/piko
          path: "."
          submodules: recursive
          fetch-depth: 1

      # piko's own submodule pointer for userspace/src/pikostore is
      # whatever commit piko last pinned -- replace it with the exact
      # pikostore commit this workflow is building.
      - name: Overlay this pikostore commit onto piko's pikostore submodule slot
        run: rm -rf userspace/src/pikostore

      - name: Check out this pikostore commit
        uses: actions/checkout@v4
        with:
          path: userspace/src/pikostore
          fetch-depth: 1

      - name: Install X11 stack build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config python3 x11proto-dev

      # Cached, from tools/build-uclibc-toolchain.sh via piko's own
      # composite action -- see .github/actions/piko-uclibc-toolchain in
      # the piko repo for what this restores/builds and verifies.
      - name: Provision the piko uClibc cross-toolchain
        id: toolchain
        uses: ./.github/actions/piko-uclibc-toolchain

      - name: Cache third-party X11 dependency sources
        uses: actions/cache@v4
        with:
          path: userspace/.thirdparty-cache
          key: thirdparty-src-v1-${{ hashFiles('tools/build-thirdparty-deps.sh') }}
          save-always: true

      # tools/build-thirdparty-deps.sh's fetch() skips downloading a
      # tarball that is already present in userspace/.thirdparty-cache and
      # just re-verifies its sha256 -- so seeding it here bypasses upstream
      # mirrors this workflow has seen return transient errors (see
      # tools/thirdparty-cache/README.md in this repo for exactly which
      # ones, and why). fontconfig and xkeyboard-config are NOT vendored
      # yet, so those two still go over the network.
      - name: Seed vendored third-party tarballs (works around flaky upstream mirrors)
        run: |
          mkdir -p userspace/.thirdparty-cache
          cp -n userspace/src/pikostore/tools/thirdparty-cache/*.tar.gz \
                userspace/src/pikostore/tools/thirdparty-cache/*.tar.bz2 \
                userspace/.thirdparty-cache/
          ls -la userspace/.thirdparty-cache/

      - name: Build third-party X11 dependencies (zlib/expat/libpng/freetype/fontconfig/xkeyboard-config/dejavu)
        run: ./tools/build-thirdparty-deps.sh

      # build-x11-stack.sh's xorgproto-header staging only has a working
      # auto-detection path for Arch (`pacman -Ql xorgproto`); on Debian/
      # Ubuntu it assumes `pkg-config --cflags xproto` returns a real -I
      # flag, but on this runner's pkg-config that Cflags is empty --
      # `-I/usr/include` gets stripped as a default system path -- so with
      # nothing already staged it fails outright ("pacman not available").
      # Reproduced directly: `pkg-config --cflags xproto` prints nothing
      # here. Not a piko bug worth patching from this repo (no push access,
      # and it's piko's script) -- instead, satisfy its own "already
      # staged" escape hatch ourselves the same way the pacman branch would:
      # copy exactly the files x11proto-dev owns (dpkg -L, the apt
      # equivalent of `pacman -Ql xorgproto`) into userspace/stage-target.
      - name: Pre-stage xorgproto headers (see comment -- works around a Debian/Ubuntu gap in build-x11-stack.sh's own detection)
        run: |
          mkdir -p userspace/stage-target/usr/include
          dpkg -L x11proto-dev | grep '^/usr/include/' | while read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/usr/include/}"
            mkdir -p "userspace/stage-target/usr/include/$(dirname "$rel")"
            cp -n "$f" "userspace/stage-target/usr/include/$rel"
          done
          test -f userspace/stage-target/usr/include/X11/Xfuncproto.h

      # Builds the whole X.Org + Matchbox stack into userspace/stage-target,
      # and -- at its own end, see tools/build-x11-stack.sh's header --
      # also builds FLTK via tools/build-fltk.sh. Not cached across runs:
      # it builds in place inside freshly checked-out submodules, and
      # restoring a cache there would silently overwrite what checkout
      # just correctly fetched with stale content (same reasoning
      # build-piko-zip.yml documents for this same step).
      - name: Build the X11/Matchbox stack (includes FLTK)
        env:
          TOOLCHAIN_BIN_DIR: ${{ steps.toolchain.outputs.toolchain_bin_dir }}
        run: ./tools/build-x11-stack.sh

      # Runs pikostore's own host-side tests (tests/romstate-test.cxx)
      # before cross-building -- see tools/build-pikostore.sh's header.
      - name: Build pikostore
        env:
          TOOLCHAIN_BIN_DIR: ${{ steps.toolchain.outputs.toolchain_bin_dir }}
        run: ./tools/build-pikostore.sh

      - name: Package pikostore.ipk
        run: |
          VERSION="$(cd userspace/src/pikostore && git describe --always --dirty 2>/dev/null || echo 0.0.0-unknown)"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/pixmaps"
          cp userspace/stage-target/usr/bin/pikostore "$STAGE/usr/bin/"
          cp userspace/desktop/pikostore.desktop "$STAGE/usr/share/applications/"
          cp userspace/desktop/pikostore.png "$STAGE/usr/share/pixmaps/"
          ./tools/make-ipk.sh --name pikostore --version "$VERSION" \
              --root "$STAGE" --arch piko \
              --desc "Software Center - install updates and manage packages" \
              --out "$GITHUB_WORKSPACE/dist"
          rm -rf "$STAGE"
          {
            echo "### pikostore.ipk"
            echo '```'
            ls -la "$GITHUB_WORKSPACE"/dist/*.ipk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pikostore.ipk
        uses: actions/upload-artifact@v4
        with:
          name: pikostore-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                     --title "$GITHUB_REF_NAME" --notes "Automated pikostore build."
          gh release upload "$GITHUB_REF_NAME" dist/*.ipk --repo "$GITHUB_REPOSITORY" --clobber
